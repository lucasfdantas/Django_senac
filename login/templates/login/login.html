{% extends 'base.html' %}

{% block title %}Entrar | Meu Projeto{% endblock title %}

{% block content %}
<div class="auth-card">
    <h2>Acessar Conta</h2>
    <form method="post">
        {% csrf_token %}
        <!-- Preserva o destino pretendido -->
        {% if next %}
        <input type="hidden" name="next" value="{{ next }}">
        {% endif %}



        <div class="form-group">
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" required autocomplete="email">
        </div>
        <div class="form-group">
            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary">Continuar</button>
    </form>
    <p>Ainda não tem conta? <a href="{% url 'cadastro' %}">Cadastre-se</a></p>
</div>
{% endblock content %}
