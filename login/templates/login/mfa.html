{% extends 'base.html' %}

{% block title %}Verificação em Duas Etapas{% endblock title %}

{% block content %}
<div class="auth-card">
    <h2>Confirmação de Segurança</h2>
    <p>Enviamos um código de 6 dígitos para o seu e-mail cadastrado. Ele expira em 5 minutos.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="code">Código de Acesso</label>
            <input type="text" name="code" id="code" maxlength="6" pattern="[0-9]{6}" required placeholder="000000" autofocus autocomplete="one-time-code">
        </div>
        <button type="submit" class="btn-primary">Verificar e Entrar</button>
    </form>
    <p><a href="{% url 'login' %}">Voltar para o login</a></p>
</div>
{% endblock content %}
